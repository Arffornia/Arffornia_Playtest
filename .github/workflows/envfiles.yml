# Publishes the pack-files image (envfiles/) as ghcr.io/arffornia/playtest-envfiles.
# Tags:
#   tree-<12>  the git tree hash of envfiles/: content-addressed, known before the merge, and
#              what TheGostsniperfr/infra pins (the same files always give the same tag);
#   sha-<7>    the commit that published it;
#   main       moving, for humans.
name: pack-files image

on:
  push:
    branches: [main]
    paths:
      - "envfiles/**"
      - ".github/workflows/envfiles.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: envfiles-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Smoke test before publishing
        run: envfiles/test/smoke.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD:envfiles | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: envfiles
          push: true
          tags: |
            ghcr.io/arffornia/playtest-envfiles:tree-${{ steps.tags.outputs.tree }}
            ghcr.io/arffornia/playtest-envfiles:sha-${{ steps.tags.outputs.short }}
            ghcr.io/arffornia/playtest-envfiles:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=pack-files: Arffornia_Provisioning with the test mod tag and profile (spec 016)
            org.opencontainers.image.licenses=MIT

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TREE: ${{ steps.tags.outputs.tree }}
        run: |
          {
            echo "Published \`ghcr.io/arffornia/playtest-envfiles:tree-${TREE}@${DIGEST}\`."
            echo
            echo "TheGostsniperfr/infra pins tree-${TREE} (k8s/config/arffornia/playtest/pack-files)."
          } >> "$GITHUB_STEP_SUMMARY"
