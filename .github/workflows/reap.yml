# The reaper (spec 016, D6): every 3 hours, frees the slots in `envs/` that expired, whose PR is
# closed or merged, or whose file is invalid. Argo CD then removes the environment.
name: reap

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only report"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reap
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reap expired and closed slots
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: node kit/reap.mjs $DRY_RUN
